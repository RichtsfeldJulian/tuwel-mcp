[project]
name = "tuwel-mcp"
version = "0.1.0"
description = "MCP server giving AI agents access to TU Wien TUWEL (Moodle) with SSO + 2FA login"
readme = "README.md"
authors = [
    { name = "Julian Richtsfeld", email = "jri@agravity.io" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "mcp[cli]>=1.12",
    "pyotp>=2.10.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[project.scripts]
tuwel-mcp = "tuwel_mcp:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
